name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q football-millionaire.zip
          cp -r football-millionaire/. .

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm install

      - name: Copy Arabic font
        run: |
          mkdir -p www/fonts
          cp node_modules/@fontsource/cairo/files/cairo-arabic-700-normal.woff2 www/fonts/
          cp node_modules/@fontsource/cairo/files/cairo-
